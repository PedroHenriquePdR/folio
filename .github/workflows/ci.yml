name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: native/certsign/go.mod
          cache-dependency-path: native/certsign/go.sum
      - run: npm ci
      - name: Install tools for the isolated NSS test database
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools openssl
      - name: Use OpenSSL from Homebrew
        if: runner.os == 'macOS'
        run: echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: npm run test:certsign
      - run: node --test scripts/test-certificate-signing.cjs scripts/test-certificate-pdf.cjs
      - run: npm run build:certsign
      - name: Sign a PDF with a generated identity in the system certificate store
        env:
          FOLIO_TEST_SIGNING_IDENTITY: "1"
        run: node --test scripts/test-certificate-nss.cjs
      # Everything, not --omit=dev: the libraries bundled into the app (pdf.js, KaTeX, the Markdown and OCR
      # code) and Electron itself are devDependencies here, so leaving them out audits almost nothing that ships.
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run test:chat-math
      - run: npm run test:thumbnails
      - run: node --test scripts/test-word-files.cjs scripts/test-network-security.cjs scripts/test-release-build.mjs scripts/test-claude-path.cjs
      - run: node --test scripts/test-link-history.mjs scripts/test-text-direction.mjs
      - run: node --test scripts/test-openrouter.cjs scripts/test-custom-endpoint.cjs
      - run: npm run build
      - name: Verify the universal macOS certificate signer
        if: runner.os == 'macOS' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/')
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          output=$(mktemp -d "$RUNNER_TEMP/folio-ci-universal.XXXXXX")
          npx --no-install electron-builder --mac --universal --dir --publish never -c.directories.output="$output"
          bundle="$output/mac-universal/Folio.app"
          signer="$bundle/Contents/Resources/certsign/folio-certsign"
          lipo -verify_arch x86_64 arm64 "$signer"
          node scripts/build-certificate-signer.mjs --check "$signer"
          codesign --verify --deep --verbose=2 "$bundle"
      - name: Browser Edition link shortcuts
        run: |
          npx --no-install playwright-core install chromium --only-shell
          node scripts/test-browser-link-shortcuts.mjs
      - name: Smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          # Ubuntu 24.04 restricts the user namespaces Chromium's sandbox needs; installed Folio packages
          # ship an AppArmor profile for this, but the development Electron binary doesn't.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npx --no-install playwright-core install ffmpeg
          xvfb-run -a npm run test:reader-security
          FOLIO_PRINT_VIDEO=1 FOLIO_LINK_VIDEO=1 xvfb-run -a npm run smoke
      - name: Reader security regressions
        if: runner.os != 'Linux'
        env:
          FOLIO_TEST_CLIENT_IDENTITY: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: npm run test:reader-security
      - name: Smoke test
        if: runner.os != 'Linux'
        run: npm run smoke
      # Keep PR and temporary CI-run screenshots on the runner; only main retains its existing artifact.
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: smoke-${{ matrix.os }}
          path: release/smoke/
          if-no-files-found: ignore
